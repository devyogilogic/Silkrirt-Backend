name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'sudo bash -s' << 'EOF'
            set -e
            cd /home/ubuntu/silkriti-backend
            git pull origin main
            rm -rf node_modules
            npm ci --omit=dev --legacy-peer-deps
            pm2 describe silkriti-backend > /dev/null 2>&1 \
              && pm2 restart silkriti-backend --update-env \
              || pm2 start /home/ubuntu/silkriti-backend/ecosystem.config.js --only silkriti-backend --env production
            pm2 save
          EOF
